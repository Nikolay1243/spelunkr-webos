<!doctype html>
<html lang="en" class="theme-8s tv"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spelunkr for webOS</title>
<base href="https://spelunkr.tv/">
<meta name="theme-color" content="#1c0a57">
<style>html,body{margin:0;background:#1c0a57;color:#ffe200}#webos-loading{height:100vh;display:flex;align-items:center;justify-content:center;font:24px monospace}</style>
</head><body><div id="app"><div id="webos-loading">PLEASE STAND BY</div></div>
<script>
(function(){
  var base=window.location.href;
  var css=document.createElement('link');css.rel='stylesheet';css.href=new URL('app.css',base).href;document.head.appendChild(css);
  var script=document.createElement('script');script.src=new URL('app.js',base).href;
  script.onerror=function(){document.getElementById('app').textContent='SIGNAL LOST. Close and reopen Spelunkr.';};
  document.body.appendChild(script);
  var watch=document.createElement('script');watch.src=new URL('watch-on-boot.js',base).href;document.body.appendChild(watch);
})();
</script></body></html>
